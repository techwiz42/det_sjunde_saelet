# Det sjunde sälet — shot list.
#
# `anchors` are the fixed character-description blocks referenced by shot
# entries. scripts/emit_prompts.py splices the anchor text for every name in
# a shot's `characters` list onto the front of that shot's `image_prompt`,
# in list order, followed by the scene text below and finally the global
# `style_suffix` from config.yaml. This is why `image_prompt` below is
# SCENE-ONLY (setting/action/composition/camera/light) — it never repeats a
# character's physical description, so the look stays consistent by
# construction: change an anchor once here and every prompt that uses it
# picks up the change next time emit_prompts.py runs.
#
# `cut: hard` on a shot means the transition INTO that shot (from whatever
# precedes it) is a hard cut. Its absence means the default 12-frame
# crossfade (config.yaml: crossfade_frames) applies. Hard cuts are reserved
# for act/location breaks.
#
# `motion.amount` is the fraction of the frame traversed over the shot's
# full duration — keep these small, the moves must be barely perceptible.
# `hold` shots carry amount: 0.0 by convention (render_shot.py ignores
# amount for `hold` regardless, but a stated 0.0 keeps the intent explicit
# in the data rather than implicit in code).

anchors:
  antonius: >-
    Antonius, a lean grey harbor seal with a faded red-and-white striped
    ruff collar at the neck, sharp intelligent eyes, and a deck of worn
    playing cards always near one flipper
  jons: >-
    Jöns, a heavyset grizzled harbor seal with a scarred muzzle, a small
    cracked monocle over one eye, and a threadbare black tailcoat collar,
    wearing a permanently weary expression
  skat: >-
    Skat, a sleek harbor seal in a diamond-patterned harlequin ruff and a
    small peaked jester's cap strapped beneath the chin, with exaggerated
    painted markings around the eyes
  plog: >-
    Plog, a broad-shouldered bull seal in a striped strongman's collar, a
    loose padlocked chain draped around the neck, and a dented tin medal
    pinned crookedly to the chest
  raval: >-
    Raval, a thin, shifty-eyed harbor seal in a patched carnival vest and a
    wide oilskin collar, one flipper permanently resting near a small
    wooden ventriloquist's crate
  lilla_gunnar: >-
    Lilla Gunnar, a herring hand-puppet with two painted-on eyes, a tiny
    hand-stitched felt bowtie, and a plain wooden dowel visible where a
    hand would hold it from below
  jof: >-
    Jof, a young harbor seal with an unusually gentle, wide-eyed expression
    and a faded blue neckerchief, often tilting his head as though
    listening to something no one else can hear
  selkirk: >-
    Dr. S. Selkirk, a distinguished harbor seal with round tortoiseshell
    spectacles, silver-flecked whiskers, and a dark knit tie neatly knotted
    at the throat, composed and clinical in bearing
  death: >-
    Death, a tall gaunt figure in a heavy black hooded robe, a pale hollow
    face half lost in shadow beneath the hood, long white hands, and an
    utterly still, unhurried posture

shots:
  # ─── Act 1: the stay ──────────────────────────────────────────────────
  - id: "010_dawn_shore"
    act: 1
    publish_order: 1
    production_priority: high
    duration: 6.0
    characters: []
    image_prompt: >-
      Wide static shot along an empty stony Baltic shoreline at first
      light. Flat calm sea, low raking sun just above the horizon, cold
      mist low over the water, no figures present, long lens compression,
      soft contrast.
    motion:
      type: hold
      amount: 0.0
    narration: >-
      The coast keeps its own counsel. It has seen circuses before, and it
      will see this one leave.
    music_cue: "bach_air_on_the_g_string.mp3"

